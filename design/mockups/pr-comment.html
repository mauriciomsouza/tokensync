<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>tokensync · PR comment</title>
    <style>
      /*
       * A neutral approximation of a pull-request comment, used only to show how
       * the Markdown renders. The body is the real `tokensync check --markdown`
       * output parsed as GitHub-flavored Markdown.
       */
      body {
        margin: 0;
        padding: 32px;
        background: #ffffff;
        color: #1f2328;
        font:
          14px/1.5 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'Noto Sans',
          Helvetica,
          Arial,
          sans-serif;
      }
      .frame {
        display: flex;
        gap: 16px;
        padding: 8px;
      }
      .avatar {
        flex: none;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #16161a;
        display: grid;
        place-items: center;
      }
      .avatar i {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: conic-gradient(#fff 0 50%, transparent 0);
        box-shadow: inset 0 0 0 2px #fff;
      }
      .box {
        flex: 1;
        min-width: 0;
        border: 1px solid #d1d9e0;
        border-radius: 6px;
      }
      .head {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 16px;
        background: #f6f8fa;
        border-bottom: 1px solid #d1d9e0;
        border-radius: 6px 6px 0 0;
        color: #59636e;
      }
      .head b {
        color: #1f2328;
      }
      .tag {
        border: 1px solid #d1d9e0;
        border-radius: 2em;
        padding: 0 7px;
        font-size: 12px;
        font-weight: 500;
      }
      .body {
        padding: 16px;
      }
      .body > :first-child {
        margin-top: 0;
      }
      h3 {
        font-size: 1.25em;
        margin: 0 0 16px;
      }
      p {
        margin: 0 0 16px;
      }
      table {
        border-collapse: collapse;
        margin: 0 0 16px;
        display: block;
        width: max-content;
        max-width: 100%;
        overflow: auto;
      }
      th,
      td {
        padding: 6px 13px;
        border: 1px solid #d1d9e0;
      }
      th {
        font-weight: 600;
      }
      tr:nth-child(2n) {
        background: #f6f8fa;
      }
      code {
        padding: 0.2em 0.4em;
        font:
          85% ui-monospace,
          SFMono-Regular,
          'SF Mono',
          Menlo,
          Consolas,
          monospace;
        background: rgb(129 139 152 / 0.12);
        border-radius: 6px;
      }
      sub {
        color: #59636e;
      }
      details {
        margin: 0 0 16px;
      }
      summary {
        cursor: pointer;
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="avatar"><i></i></div>
      <div class="box">
        <div class="head">
          <b>tokensync</b><span class="tag">bot</span><span>commented on pull request #128 · edited</span>
        </div>
        <div class="body">{{BODY}}</div>
      </div>
    </div>
  </body>
</html>
